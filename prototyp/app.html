<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fasádní akademie ZOFI</title>
<link rel="stylesheet" href="shared/base.css">
<style>
/* ================= tokeny ================= */
:root{
  --sbw:248px;
  --bg:#f2f2f5; --surface:#fff; --surface-2:#f5f5f7; --surface-3:#ebebf0;
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#8e8e93;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.14);
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.2);
  --accent:#e62152; --accent-ink:#c4173f; --accent-soft:rgba(230,33,82,.1);
  --ok:#1f8a4c; --ok-soft:rgba(31,138,76,.12); --warn:#b25d00; --warn-soft:rgba(255,149,0,.14); --bad:#d70015; --bad-soft:rgba(215,0,21,.08);
  --r1:#e62152; --r2:#ff6b8b; --r3:#ffa3b8;
  --glass:rgba(250,250,252,.74); --glass-line:rgba(255,255,255,.8);
  --glass-shadow:0 0 0 .5px rgba(0,0,0,.12),0 12px 40px -14px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.9);
  --card-shadow:0 0 0 .5px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04),0 10px 30px -16px rgba(0,0,0,.16);
  --hover-shadow:0 0 0 .5px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.05),0 28px 50px -22px rgba(0,0,0,.28);
  --toast-bg:#1d1d1f; --toast-fg:#fff;
  color-scheme:light;
}
html[data-theme="dark"],html[data-cinema]{
  --bg:#000; --surface:#1c1c1e; --surface-2:#232326; --surface-3:#2c2c2e;
  --text:#f5f5f7; --text-2:#aeaeb2; --text-3:#8e8e93;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --accent:#ff2d63; --accent-ink:#ff6d8f; --accent-soft:rgba(255,45,99,.16);
  --ok:#30d158; --ok-soft:rgba(48,209,88,.16); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.16); --bad:#ff453a; --bad-soft:rgba(255,69,58,.14);
  --r1:#ff2d63; --r2:#ff7a98; --r3:#ffb3c5;
  --glass:rgba(36,36,40,.62); --glass-line:rgba(255,255,255,.08);
  --glass-shadow:0 0 0 .5px rgba(255,255,255,.12),0 16px 40px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07);
  --card-shadow:0 0 0 .5px rgba(255,255,255,.08);
  --hover-shadow:0 0 0 .5px rgba(255,255,255,.14),0 28px 50px -22px rgba(0,0,0,.9);
  --toast-bg:#f5f5f7; --toast-fg:#1d1d1f;
  color-scheme:dark;
}
html{background:var(--bg)}
body{overflow-x:clip;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;letter-spacing:-.012em;transition:background-color .45s var(--ease),color .45s var(--ease)}
::selection{background:var(--accent);color:#fff}
img.f{opacity:0;transition:opacity .5s var(--ease)}
img.f.ld{opacity:1}
.i{width:18px;height:18px;flex:none}
.toast{background:var(--toast-bg);color:var(--toast-fg);bottom:34px;display:flex;align-items:center;gap:14px}
.toast button{color:var(--accent-ink);font-weight:600;pointer-events:auto}
html.embed *{scrollbar-width:none}
html.embed ::-webkit-scrollbar{display:none}

/* ================= sklo, tlačítka ================= */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);box-shadow:var(--glass-shadow);border:1px solid var(--glass-line)}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:980px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;transition:transform .15s var(--ease),filter .2s,background .2s}
.bt:hover{filter:brightness(1.07)}
.bt:active{transform:scale(.97)}
.bt.sm{height:32px;padding:0 14px;font-size:13px}
.bt.lg{height:48px;padding:0 24px;font-size:16px}
.bt.light{background:#fff;color:#1d1d1f}
.bt.tint{background:var(--accent-soft);color:var(--accent-ink)}
.bt.gray{background:var(--fill);color:var(--text)}
.bt .i{width:16px;height:16px}
.cap{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:980px;font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;transition:transform .15s var(--ease),background .2s,color .2s}
.cap:active{transform:scale(.96)}
.cap.ic{width:36px;padding:0;justify-content:center}
.cap .i{width:17px;height:17px}
.cap.on{color:var(--accent-ink)}
.cap.dk{background:rgba(0,0,0,.35);color:#fff;-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(255,255,255,.14)}
.link{color:var(--accent-ink);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:980px;background:var(--fill);color:var(--text-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.chip .i{width:14px;height:14px}
.chip.dk{background:rgba(0,0,0,.4);color:#fff;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
kbd{font:500 11px var(--font);padding:2px 6px;border-radius:6px;background:var(--fill);color:var(--text-2)}
.sg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.sg::-webkit-scrollbar{display:none}
.sg button{font-size:13px;font-weight:500;padding:6px 14px;border-radius:8px;color:var(--text-2);white-space:nowrap;transition:background .2s,color .2s}
.sg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
html[data-theme="dark"] .sg button[aria-pressed="true"],html[data-cinema] .sg button[aria-pressed="true"]{background:var(--surface-3)}
.bar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .6s var(--ease)}
.segp{display:flex;gap:3px}
.segp i{flex:1;height:5px;border-radius:3px;background:var(--fill-2)}
.segp i.d{background:var(--accent)}
.segp i.p{background:linear-gradient(90deg,var(--accent) var(--p),var(--fill-2) var(--p))}

/* ================= kostra ================= */
.side{position:fixed;z-index:40;top:10px;left:10px;bottom:10px;width:var(--sbw);border-radius:24px;display:flex;flex-direction:column;padding:14px 10px 10px;view-transition-name:side}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px}
.brand svg{height:20px;width:auto}
.brand span{font-size:13px;font-weight:600;color:var(--text-2);padding-left:10px;border-left:1px solid var(--line-2)}
.sfield{display:flex;align-items:center;gap:8px;width:100%;height:34px;border-radius:10px;background:var(--fill);padding:0 8px 0 10px;color:var(--text-3);font-size:13.5px;text-align:left}
.sfield .i{width:16px;height:16px}
.sfield kbd{margin-left:auto;background:var(--surface);box-shadow:0 0 0 .5px var(--line-2)}
.snav{flex:1;overflow-y:auto;margin:6px -4px 0;padding:0 4px;scrollbar-width:none}
.snav::-webkit-scrollbar{display:none}
.snav h6{font-size:11.5px;font-weight:600;color:var(--text-3);padding:16px 10px 6px;letter-spacing:0}
.snav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;font-size:14px;transition:background .15s}
.snav a:hover{background:var(--fill)}
.snav a[aria-current]{background:var(--fill-2);font-weight:600}
.snav a .i{width:18px;height:18px;color:var(--accent)}
.snav a .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snav a .cnt{margin-left:auto;font-size:12px;color:var(--text-3);font-weight:500}
.snav a .cnt.new{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.me{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;margin-top:6px;width:100%;text-align:left;transition:background .15s}
.me:hover{background:var(--fill)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3a3a3c,#1d1d1f);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;letter-spacing:0}
.av.sm{width:26px;height:26px;font-size:10px}
.me b{display:block;font-size:13px;font-weight:600}
.me small{display:block;font-size:12px;color:var(--text-3)}
.me .i{margin-left:auto;color:var(--text-3);width:16px;height:16px}

.main{margin-left:calc(var(--sbw) + 20px);min-width:0;min-height:100vh}
.toolbar{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:10px;padding:0 28px 0 20px}
.toolbar::before{content:"";position:absolute;inset:0 0 -26px;pointer-events:none;background:linear-gradient(var(--bg) 35%,transparent);opacity:0;transition:opacity .3s}
.toolbar.scrolled::before{opacity:1}
.toolbar > *{position:relative}
.tb-l{display:flex;align-items:center;gap:8px;min-width:0}
.tb-l .cap span{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tb-t{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.toolbar.scrolled .tb-t{opacity:1}
.tb-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.mlogo,.mav{display:none}
.page{padding:0 28px 120px 20px;max-width:1300px}
.page.full{padding:0;max-width:none}

/* ================= typografie ================= */
.lt{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.032em}
.ls{font-size:15px;color:var(--text-2);margin-top:6px;max-width:720px}
.eb{font-size:13px;font-weight:600;color:var(--text-2)}
.eb.acc{color:var(--accent-ink)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:44px 0 14px}
.sh h2{font-size:22px;font-weight:700;letter-spacing:-.025em}
.sh .ls{margin:0}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--card-shadow)}
.pad{padding:22px 24px}
.ct{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ct .i{color:var(--accent)}
.muted{color:var(--text-2)}
.hov{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.hov:hover{transform:translateY(-3px);box-shadow:var(--hover-shadow)}

/* ================= kousky ================= */
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--surface-3);border-radius:14px}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
a:hover > .thumb img{transform:scale(1.04)}
.thumb .dur{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px;letter-spacing:0;font-variant-numeric:tabular-nums}
.thumb .wp{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.35)}
.thumb .wp i{display:block;height:100%;background:var(--accent)}
.thumb .dn{position:absolute;left:8px;bottom:8px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.thumb .dn .i{width:13px;height:13px}
.thumb .chip{position:absolute;left:8px;top:8px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:252px;gap:18px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:4px 4px 18px;margin:0 -4px}
.shelf::-webkit-scrollbar{display:none}
.shelf > *{scroll-snap-align:start;min-width:0}
.vcard{display:block}
.vcard h4{font-size:14.5px;line-height:1.32;font-weight:600;margin-top:10px;letter-spacing:-.012em}
.vcard p{font-size:12.5px;color:var(--text-3);margin-top:3px}
.st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text-3);box-shadow:inset 0 0 0 1.5px var(--line-2);flex:none;font-variant-numeric:tabular-nums}
.st.d{background:var(--accent);color:#fff;box-shadow:none}
.st.d .i{width:13px;height:13px}
.st.p{box-shadow:none;position:relative}
.st.p svg{position:absolute;inset:0}
.ring{display:block;flex:none}

/* soubory */
.frow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow small{font-size:12px;color:var(--text-3)}
.fico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.fico .i{width:18px;height:18px}
.fico.doc{background:var(--accent-soft);color:var(--accent-ink)}
.fico.sheet{background:var(--ok-soft);color:var(--ok)}
.fico.drawing{background:var(--fill);color:var(--text)}
.dl{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent-ink);transition:background .15s}
.dl:hover{background:var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.fcard{display:block;text-align:left;width:100%;border-radius:20px;padding:10px 10px 14px;background:var(--surface);box-shadow:var(--card-shadow)}
.fprev{aspect-ratio:4/3;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;position:relative}
.fprev .off{position:absolute;right:8px;top:8px}
.pg{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 18px -8px rgba(0,0,0,.25);border-radius:3px;width:54%;aspect-ratio:1/1.414;padding:9% 8%;display:flex;flex-direction:column;gap:5%;transition:transform .5s var(--ease)}
.pg.land{width:84%;aspect-ratio:1.414/1;padding:3%}
.fcard:hover .pg{transform:translateY(-3px) rotate(-.6deg)}
.pg .hd{display:flex;align-items:center;gap:6%}
.pg .hd i{display:block;width:18%;height:5px;border-radius:2px;background:#e62152}
.pg .hd s{display:block;flex:1;height:4px;border-radius:2px;background:#d1d1d6;text-decoration:none}
.pg u{display:block;height:3px;border-radius:2px;background:#e5e5ea;text-decoration:none}
.pg .tb{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.pg .tb u{height:6px;background:#eef0f3}
.pg .tb u.h{background:#d6eadb}
.pg svg{width:100%;height:100%}
.fcard .fn{display:flex;gap:10px;align-items:flex-start;padding:12px 4px 0}
.fcard .fn .fico{width:30px;height:30px;border-radius:8px}
.fcard .fn .fico .i{width:15px;height:15px}
.fcard b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.fcard small{display:block;font-size:12px;color:var(--text-3);margin-top:2px}

/* ================= DNES ================= */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:4px}
.hello .lt{font-size:40px}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-flow:row dense;gap:20px;margin-top:26px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.bento > section .sh{margin-top:20px}
.cine{position:relative;border-radius:26px;overflow:hidden;min-height:350px;background:#111;color:#fff;isolation:isolate}
.cine > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.cine:hover > img{transform:scale(1.035)}
.cine::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.8) 0%,rgba(0,0,0,.46) 44%,rgba(0,0,0,0) 74%),linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0) 50%);pointer-events:none}
.cine .hit{position:absolute;inset:0;z-index:1}
.cine-in{position:absolute;left:32px;right:32px;bottom:28px;z-index:2;max-width:480px;pointer-events:none}
.cine-in a,.cine-in button{pointer-events:auto}
.cine .eb{color:rgba(255,255,255,.75)}
.cine h3{font-size:30px;line-height:1.08;font-weight:700;letter-spacing:-.03em;margin:8px 0 6px}
.cine .sub{font-size:14px;color:rgba(255,255,255,.72)}
.cine .pr{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:13px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.cine .pr .bar{flex:1;background:rgba(255,255,255,.22)}
.cine .pr .bar i{background:#fff}
.cine .acts{display:flex;gap:10px;flex-wrap:wrap}
.nextc{display:flex;flex-direction:column}
.nextc h3{font-size:21px;font-weight:700;letter-spacing:-.025em;margin:6px 0 10px;line-height:1.15}
.nextc .pm{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);margin-bottom:6px}
.nextc .pm .bar{flex:1}
.wxl{display:flex;align-items:center;gap:10px;margin-top:auto;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13px;color:var(--text-2)}
.wxl .i{color:var(--warn);width:22px;height:22px}
.wxl b{color:var(--text);font-weight:600}
.todo{list-style:none;margin:6px 0 14px}
.todo li{border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;font-size:14.5px}
.ck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--line-2);display:grid;place-items:center;flex:none;color:#fff;transition:background .25s,box-shadow .25s,transform .2s var(--ease)}
.ck .i{width:14px;height:14px;opacity:0;transform:scale(.3);transition:all .3s var(--ease)}
.todo li.on .ck{background:var(--accent);box-shadow:none}
.todo li.on .ck .i{opacity:1;transform:none}
.todo li.on .tx{color:var(--text-3)}
.todo button:active .ck{transform:scale(.88)}
.shelf.tips{grid-auto-columns:178px}
.tipc{position:relative;display:block;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#111;color:#fff;isolation:isolate;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.tipc:hover{transform:translateY(-4px);box-shadow:var(--hover-shadow)}
.tipc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tipc img.lbx,.vframe img.lbx{transform:scale(1.34)}
.tipc::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.2) 46%,rgba(0,0,0,0) 66%)}
.tipc .chip{position:absolute;left:10px;top:10px;z-index:1}
.tipc .tin{position:absolute;left:12px;right:12px;bottom:12px;z-index:1}
.tipc h4{font-size:14.5px;line-height:1.24;font-weight:700;letter-spacing:-.015em}
.tipc .d{display:flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,.8);margin-top:6px}
.tipc .d .i{width:11px;height:11px}
.quiz .eb a{color:inherit;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.quiz h3{font-size:19px;line-height:1.3;font-weight:650;letter-spacing:-.02em;margin:10px 0 16px}
.qopts{display:grid;gap:8px}
.qo{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 14px;border-radius:14px;text-align:left;font-size:15px;box-shadow:inset 0 0 0 1px var(--line-2);transition:background .2s,box-shadow .2s,transform .15s}
.qo:hover:not(:disabled){background:var(--surface-2)}
.qo:active:not(:disabled){transform:scale(.99)}
.qo .qk{width:26px;height:26px;border-radius:8px;background:var(--fill);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--text-2);flex:none}
.qo .qi{margin-left:auto}
.qo.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 1.5px var(--ok)}
.qo.ok .qk{background:var(--ok);color:#fff}

.burst{position:absolute;pointer-events:none;inset:0;overflow:visible}

.ringsc{display:flex;align-items:center;gap:20px}

.rg{animation:rg 1.4s var(--ease) both}

.rlg{display:grid;gap:8px;font-size:13px}

.ansc{display:flex;flex-direction:column}

/* ================= KURZY ================= */
.feat{position:relative;height:440px;border-radius:30px;overflow:hidden;margin-top:24px;background:#111;color:#fff;isolation:isolate}
.fsl{position:absolute;inset:0;opacity:0;transition:opacity 1s var(--ease);pointer-events:none}

.fsl > img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 8s linear}
.fsl.on > img{transform:scale(1)}
.fsl::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.35) 50%,rgba(0,0,0,0) 78%),linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,0) 40%)}
.fin{position:absolute;left:44px;bottom:42px;max-width:540px;z-index:1}
.fin .eb{color:rgba(255,255,255,.75)}

.fin p{color:rgba(255,255,255,.78);font-size:16px}
.fin .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.fdots{position:absolute;right:30px;bottom:30px;display:flex;gap:6px;z-index:2}
.fdots button{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.4);transition:width .4s var(--ease),background .3s}
.fdots button.on{width:28px;background:#fff}
.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.pathc{padding:22px 22px 20px;position:relative}
.pathc.mine{box-shadow:inset 0 0 0 2px var(--accent),var(--card-shadow)}
.pathc .mt{position:absolute;right:16px;top:16px}
.pathc h3{font-size:18px;font-weight:700;letter-spacing:-.02em}
.pathc p{font-size:13.5px;color:var(--text-2);margin-top:4px;max-width:85%}
.chain{display:flex;align-items:flex-start;margin-top:22px}
.node{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;position:relative;font-size:11.5px;line-height:1.25;color:var(--text-2);min-width:0}
.node + .node::before{content:"";position:absolute;top:17px;right:50%;width:100%;height:2px;background:var(--fill-2)}
.node.d + .node::before,.node.d + .node.d::before{background:var(--accent)}
.nc{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;position:relative;z-index:1;color:var(--text-2);box-shadow:0 0 0 4px var(--surface);transition:transform .2s var(--ease)}
.node:hover .nc{transform:scale(1.08)}
.nc .i{width:16px;height:16px}
.node.d .nc{background:var(--accent);color:#fff}
.node.c .nc{background:var(--surface);color:var(--accent);box-shadow:0 0 0 4px var(--surface),inset 0 0 0 2px var(--accent)}
.node span{padding:0 4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.posters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.poster{position:relative;display:block;aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:#111;color:#fff;box-shadow:var(--card-shadow);isolation:isolate;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.poster:hover{transform:translateY(-5px);box-shadow:var(--hover-shadow)}
.poster > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.poster:hover > img{transform:scale(1.05)}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 70%)}
.poster > .chip{position:absolute;left:16px;top:16px;z-index:1}
.pin{position:absolute;left:20px;right:20px;bottom:20px;z-index:1}
.pin small{font-size:12px;color:rgba(255,255,255,.7)}
.pin h3{font-size:23px;line-height:1.1;font-weight:700;letter-spacing:-.028em;margin:4px 0 8px}
.pin p{font-size:13px;color:rgba(255,255,255,.75);margin-bottom:14px}
.pin .segp i{background:rgba(255,255,255,.24)}
.pin .segp i.d{background:#fff}
.pin .segp i.p{background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.24) var(--p))}

/* ================= KURZ (kino) ================= */

.cmeta{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:14px;color:rgba(255,255,255,.8)}

.cacts{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}

.chap{margin-top:30px}

.chap-h p{font-size:13px;color:var(--text-3)}
.chap-h .cpr{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.shelf.epis{grid-auto-columns:300px}
.epi{display:block}

.epi .tg{display:flex;gap:6px;margin-top:10px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.out{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.out .i{color:var(--accent);margin-top:1px}
.certw{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:center}
.cert{position:relative;aspect-ratio:1.414/1;border-radius:16px;background:#fbfaf7;color:#1d1d1f;box-shadow:0 40px 70px -40px rgba(0,0,0,.8),0 0 0 .5px rgba(0,0,0,.1);overflow:hidden}
.cert-in{position:absolute;inset:0;padding:7% 8%;display:flex;flex-direction:column}
.cert-in::before{content:"";position:absolute;inset:12px;border:1px solid #e6dfd0;border-radius:9px;pointer-events:none}
.cert-in .lg svg{height:20px;width:auto}
.cert-k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#a08a5e;margin-top:auto}
.cert h3{font-family:ui-serif,"New York","Iowan Old Style",Georgia,serif;font-size:clamp(22px,2.5vw,34px);font-weight:600;letter-spacing:-.01em;margin-top:6px}

.seal{position:absolute;right:8%;top:9%;width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #e6dfd0,0 0 0 6px #fbfaf7,0 0 0 7px #e6dfd0;display:grid;place-items:center}

.lockov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#1d1d1f}
.lockov div{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:14px 18px;border-radius:16px;font-size:13px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.3)}
.certtx h3{font-size:24px;font-weight:700;letter-spacing:-.025em}
.certtx p{color:var(--text-2);margin:8px 0 18px}
.certtx .bar{margin-bottom:8px}

/* ================= LEKCE (kino) ================= */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;margin-top:2px}
.player{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 40px 90px -40px rgba(0,0,0,.9),0 0 0 .5px rgba(255,255,255,.08)}

.poster-l{position:absolute;inset:0;cursor:pointer}
.poster-l img{width:100%;height:100%;object-fit:cover;opacity:.92;transition:transform 1.2s var(--ease),opacity .4s}
.poster-l:hover img{transform:scale(1.02);opacity:1}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 .5px rgba(255,255,255,.3),0 20px 40px -10px rgba(0,0,0,.5);transition:transform .3s var(--ease)}
.bigplay .i{width:30px;height:30px;margin-left:4px}

.resume{position:absolute;left:18px;bottom:16px;font-size:13px;font-weight:500;color:#fff}
.mrail{display:flex;gap:3px;height:24px;align-items:center;margin-top:10px}

.mseg i{display:block;width:100%;height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden;transition:height .2s var(--ease)}

.mseg::after{content:attr(data-l);position:absolute;bottom:26px;left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;font-size:12px;font-weight:500;background:var(--surface-3);color:var(--text);padding:5px 9px;border-radius:8px;opacity:0;pointer-events:none;transition:all .2s var(--ease);z-index:3}
.mseg:hover::after{opacity:1;transform:translateX(-50%)}
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:16px;flex-wrap:wrap}
.lhead > div:first-child{flex:1 1 380px;min-width:0}
.crumb{font-size:13px;font-weight:600;color:var(--accent-ink)}
.lhead h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.032em;margin:6px 0 6px}
.lmeta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
.lmeta span{display:flex;align-items:center;gap:5px}

.lacts{display:flex;gap:8px;flex-wrap:wrap}
.lgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:22px;align-items:start}
.lgrid .span2{grid-column:1/-1}
.moms{display:grid;gap:2px}
.mom{display:flex;align-items:center;gap:12px;padding:9px 10px;margin:0 -10px;border-radius:12px;text-align:left;font-size:14.5px;transition:background .2s}
.mom:hover{background:var(--fill)}
.mom.on{background:var(--accent-soft)}
.mom.on span:last-child{color:var(--accent-ink);font-weight:600}
.tc{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-2);background:var(--fill);padding:3px 7px;border-radius:7px;flex:none}
.mom.on .tc{background:var(--accent);color:#fff}
.keys{list-style:none;counter-reset:k}
.keys li{counter-increment:k;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0;font-size:14.5px;line-height:1.45}
.keys li::before{content:counter(k);width:24px;height:24px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.mist{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:16px;align-items:center;background:var(--bad-soft);border-radius:22px;padding:18px 20px;transition:transform .3s var(--ease)}
.mist:hover{transform:translateY(-2px)}
.mist .ct{color:var(--bad);margin-bottom:6px}
.mist .ct .i{color:var(--bad)}
.mist p{font-size:14px;line-height:1.45}
.mist .paper{border-radius:12px;padding:4px}
.notes{display:grid;gap:8px;margin-bottom:12px}
.nt{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.nt .tc{cursor:pointer}
.nt .tc:hover{background:var(--accent);color:#fff}
.nform{display:flex;gap:8px;align-items:center;background:var(--fill);border-radius:14px;padding:6px 6px 6px 8px}

.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.pn a{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surface);box-shadow:var(--card-shadow);transition:transform .3s var(--ease)}
.pn a:hover{transform:translateY(-2px)}
.pn a .thumb{border-radius:10px}
.pn small{font-size:12px;color:var(--text-3)}
.pn b{display:block;font-size:14px;font-weight:600;line-height:1.3;margin-top:2px}
.outline{position:sticky;top:72px;border-radius:22px;background:var(--surface);box-shadow:var(--card-shadow);overflow:hidden;max-height:calc(100vh - 92px);display:flex;flex-direction:column}
.oh{padding:18px 18px 14px;border-bottom:1px solid var(--line)}

.ol a .du{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.nextov{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;animation:fadein .4s}

.cring{width:56px;height:56px}

.celeb{position:relative}

.detc p{font-size:13px;color:var(--text-2);margin-top:4px}
.detc .tg{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.paper{background-color:#fff;background-image:linear-gradient(#eef0f3 1px,transparent 1px),linear-gradient(90deg,#eef0f3 1px,transparent 1px);background-size:20px 20px;border-radius:16px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:24px}

.dleg{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font-size:12px;color:var(--text-3);border-top:1px solid var(--line)}
.dright{display:grid;gap:16px}
.dright p{font-size:15px;line-height:1.5;color:var(--text-2)}
.dsteps{list-style:none}
.dsteps li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:10px;margin:0 -10px;border-radius:12px;font-size:15px;line-height:1.45;transition:background .2s}
.dsteps li:hover,.dsteps li.on{background:var(--accent-soft)}
.dsteps .n{width:24px;height:24px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:12px;font-weight:700;transition:background .2s,color .2s}
.dsteps li:hover .n,.dsteps li.on .n{background:var(--accent);color:#fff}
.badc{background:var(--bad-soft)!important;box-shadow:none!important}
.badc .ct,.badc .ct .i{color:var(--bad)}
.badc p{color:var(--text)!important}
.lrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;margin:0 -8px;border-radius:14px;transition:background .15s;text-align:left;width:calc(100% + 16px)}
.lrow:hover{background:var(--fill)}
.lrow .thumb{border-radius:10px}
.lrow b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.lrow small{font-size:12px;color:var(--text-3)}
.lrow .tc{background:var(--accent-soft);color:var(--accent-ink)}
.mats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* výkresy */
.dwg{width:100%;height:auto;display:block}
.dwg .co line,.dwg .bm line{stroke:#1d1d1f;stroke-width:.9}
.dwg .co circle{fill:#fff;stroke:#1d1d1f;stroke-width:1.2;transition:fill .2s,stroke .2s}
.dwg .co text,.dwg .bm text{font:700 11px var(--font);fill:#1d1d1f;text-anchor:middle;dominant-baseline:central;transition:fill .2s}
.dwg .co.hl circle{fill:#e62152;stroke:#e62152}
.dwg .co.hl text{fill:#fff}
.dwg .co.hl line{stroke:#e62152}
.dwg .bm circle{fill:#e62152;stroke:#e62152}
.dwg .bm text{fill:#fff}
.dwg .bm line{stroke:#e62152}
.dwg .lb{font:500 10.5px var(--font);fill:#8e8e93}
.dwg .kt line{stroke:#8e8e93;stroke-width:.8}
.dwg .kt text{font:500 10px var(--font);fill:#8e8e93;text-anchor:middle}
.dwg.anim .mode{animation:dfade .5s var(--ease)}
@keyframes dfade{from{opacity:0}}

/* ================= TIPY ================= */
.feed{position:relative;height:calc(100vh - 64px);overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{height:calc(100vh - 64px);scroll-snap-align:start;display:flex;align-items:center;justify-content:center;gap:36px;padding:10px 0 24px}
.vframe{position:relative;height:min(calc(100vh - 110px),860px);aspect-ratio:9/16;border-radius:30px;overflow:hidden;background:#000;color:#fff;box-shadow:0 40px 90px -40px rgba(0,0,0,.9),0 0 0 .5px rgba(255,255,255,.1);cursor:pointer;isolation:isolate}
.vframe > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s}
.vframe::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0) 45%);pointer-events:none;z-index:2}
.vcrop{position:absolute;top:0;bottom:0;left:50%;height:100%;aspect-ratio:16/9;transform:translateX(-50%);z-index:1}
.vcrop iframe,.vcrop > div{width:100%;height:100%;border:0;pointer-events:none}
.vframe.playing > img{opacity:0}
.vframe .bigplay{z-index:3}
.vframe.playing:not(.paused) .bigplay{opacity:0;transform:translate(-50%,-50%) scale(.8)}
.vframe .bigplay{transition:opacity .3s,transform .3s var(--ease)}
.vframe .tprog{position:absolute;left:14px;right:14px;top:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.3);z-index:3;overflow:hidden}
.vframe .tprog i{display:block;height:100%;width:0;background:#fff}
.vover{position:absolute;left:18px;right:18px;bottom:18px;z-index:3;display:none}
.vover h3{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.vover p{font-size:13px;color:rgba(255,255,255,.75);margin-top:4px}
.vside{width:320px;display:flex;flex-direction:column;gap:14px}
.vside h2{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.vside .lnk{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surface);box-shadow:var(--card-shadow);text-align:left;width:100%}
.vside .lnk .thumb{border-radius:10px}
.vside .lnk small{font-size:12px;color:var(--text-3)}
.vside .lnk b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.vside .acts{display:flex;gap:8px;flex-wrap:wrap}
.vside .ctr{font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
.fnav{position:fixed;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:20}
@media (max-width:1320px){.fnav{display:none}}

/* ================= PROJEKT ================= */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:4px;flex-wrap:wrap}
.pmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:24px;padding:22px 16px 18px}
.stp{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 6px;border-radius:14px}
.stp::before{content:"";position:absolute;top:18px;right:50%;width:100%;height:2px;background:var(--fill-2)}
.stp:first-child::before{display:none}
.stp.d::before,.stp.c::before{background:var(--accent)}

.stp.c .nc::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:.35;animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.stp b{font-size:13px;font-weight:600;line-height:1.25}
.stp small{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.stp.sel b{color:var(--accent-ink)}
.stp:hover .nc{transform:scale(1.06)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.phc h2{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:4px 0 12px}
.phc .pm{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text-2);margin-bottom:14px}
.phc .pm .bar{flex:1}
.phc h4{font-size:13px;font-weight:600;color:var(--text-3);margin:22px 0 8px}
.lmini{display:grid;gap:4px}
.wx{display:flex;align-items:center;gap:16px}
.wx .big{font-size:52px;font-weight:300;letter-spacing:-.04em;line-height:1}
.wx .i{width:46px;height:46px;color:var(--warn)}
.wx p{font-size:14px;color:var(--text-2)}
.wx b{display:block;font-size:15px;color:var(--text);font-weight:600}
.wdays{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;font-size:12px;color:var(--text-2);transition:background .2s}
.wd:hover{background:var(--fill)}
.wd.on{background:var(--fill-2);color:var(--text)}
.wd .i{width:22px;height:22px}
.wd b{font-size:14px;color:var(--text);font-weight:600}

.o2{background:var(--ok)}.o1{background:var(--warn)}.o0{background:var(--bad)}
.wtxt{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13.5px;color:var(--text-2);display:flex;gap:10px;align-items:center}
.diary{display:grid;gap:12px}
.de{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start}
.de .ph{width:64px;height:64px;border-radius:14px;overflow:hidden;background:var(--surface-3);display:grid;place-items:center;color:var(--text-3)}
.de .ph img{width:100%;height:100%;object-fit:cover}
.de small{font-size:12px;color:var(--text-3)}
.de b{display:block;font-size:14px;font-weight:600;line-height:1.3;margin-top:1px}
.de p{font-size:13px;color:var(--text-2);margin-top:2px}
.dform{display:flex;gap:8px;margin-top:14px}
.dform input{flex:1;min-width:0;height:38px;border-radius:12px;border:0;background:var(--fill);padding:0 12px;font-size:14px;color:var(--text);outline:none}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:32px}
.fld{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fld > span{font-size:14px;color:var(--text-2)}
.stepr{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:12px;padding:3px}
.stepr button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:18px;color:var(--text)}
.stepr button:hover{background:var(--surface)}
.stepr input{width:64px;text-align:center;font-size:16px;font-weight:600;border:0;background:transparent;color:var(--text);outline:none;font-variant-numeric:tabular-nums}
.res{width:100%;border-collapse:collapse}
.res td{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.res td:nth-child(2){font-weight:650;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.res td:nth-child(3){color:var(--text-3);text-align:right;width:130px;white-space:nowrap;font-variant-numeric:tabular-nums}
.calc-f{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.calc-f small{font-size:12px;color:var(--text-3);max-width:420px}

/* ================= DOTAZY ================= */
.qhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:4px}
.qwrap{display:grid;grid-template-columns:290px minmax(0,1fr) 280px;height:calc(100vh - 196px);min-height:560px;margin-top:22px;overflow:hidden}
.qlist{border-right:1px solid var(--line);overflow-y:auto}
.qit{display:block;padding:15px 18px;border-bottom:1px solid var(--line);transition:background .15s}
.qit:hover{background:var(--fill)}
.qit[aria-current]{background:var(--fill-2)}
.qit b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.qit small{display:block;font-size:12px;color:var(--text-3);margin-top:3px}
.qit .s{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-top:7px}
.qit .s::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
.qit .s.ok::before{background:var(--ok)}
.qconv{display:flex;flex-direction:column;min-width:0}
.qch{padding:15px 22px;border-bottom:1px solid var(--line)}
.qch b{font-size:16px;font-weight:650;letter-spacing:-.015em}
.qch .tg{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.dsep{align-self:center;font-size:12px;color:var(--text-3)}
.msg{max-width:78%;display:flex;gap:10px;align-items:flex-end;animation:rise .35s var(--ease)}
.msg .bub{padding:11px 15px;border-radius:20px;background:var(--fill);font-size:15px;line-height:1.45}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg:not(.me) .bub{border-bottom-left-radius:6px}
.msg .mt{font-size:11.5px;color:var(--text-3);margin-top:5px;padding:0 4px}
.msg.me .mt{text-align:right}
.msg .att{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.msg .att img{width:140px;height:92px;object-fit:cover;border-radius:14px}
.sysm{align-self:center;font-size:12.5px;color:var(--text-2);background:var(--fill);padding:7px 12px;border-radius:980px;text-align:center}
.sugg{padding:0 18px}
.sugg:empty{display:none}
.sugg .sgh{font-size:12px;font-weight:600;color:var(--text-3);margin:10px 0 6px}
.sugg .sgl{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sugg a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:500;white-space:nowrap}
.sugg a .i{width:15px;height:15px}
.compose{display:flex;gap:8px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--line)}
.cbox{flex:1;border-radius:20px;background:var(--fill);padding:4px 8px 4px 14px;display:flex;flex-direction:column;min-width:0}
.cbox textarea{border:0;background:transparent;resize:none;font-size:15px;line-height:1.4;padding:7px 0;height:36px;max-height:140px;outline:none;color:var(--text)}
.atts{display:flex;gap:6px;padding-top:6px}
.atts:empty{display:none}
.atts span{position:relative}
.atts img{width:54px;height:54px;object-fit:cover;border-radius:10px}
.atts button{position:absolute;right:-5px;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}
.atts button .i{width:10px;height:10px}
.sendb{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s,background .2s}
.sendb:disabled{background:var(--fill-2);color:var(--text-3);cursor:default}
.sendb:not(:disabled):active{transform:scale(.9)}
.qctx{border-left:1px solid var(--line);overflow-y:auto;padding:18px}
.qctx h4{font-size:12px;font-weight:600;color:var(--text-3);margin:4px 0 10px}
.qctx h4 + *{margin-bottom:18px}
.simq{display:block;padding:10px 12px;border-radius:12px;background:var(--surface-2);margin-bottom:8px;font-size:13px;line-height:1.35}
.simq small{display:block;color:var(--text-3);margin-top:3px;font-size:12px}

/* ================= překryvy ================= */
.ovl{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fadein .2s}

.ck-in{display:flex;align-items:center;gap:12px;padding:0 18px;height:62px;border-bottom:1px solid var(--line)}

.ck-it.on .go{opacity:1}
.ck-empty{padding:28px 16px;text-align:center;color:var(--text-2);font-size:14px}
.ck-f{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}
.ck-f span{display:flex;align-items:center;gap:5px}
.qlook{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(960px,calc(100% - 24px));max-height:calc(100% - 40px);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);background:var(--surface);border-radius:28px;overflow:hidden;box-shadow:0 40px 100px -20px rgba(0,0,0,.55);animation:pop2 .3s var(--ease)}

.qlook .pv .pg.land{width:96%;padding:2.5%}

.kv dd a{color:var(--accent-ink)}
.qlook .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:20px}
.xbtn{position:absolute;right:14px;top:14px;z-index:2}
.setupm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(740px,calc(100% - 24px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--surface);border-radius:30px;padding:32px;box-shadow:0 40px 100px -20px rgba(0,0,0,.55);animation:pop2 .3s var(--ease)}
.setupm h2{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:10px}
.setupm .ls{margin-top:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}

.opt small{display:block;font-size:13px;color:var(--text-2);margin-top:2px;line-height:1.35}
.sfoot{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
.sdots{display:flex;gap:6px}
.sdots i{width:7px;height:7px;border-radius:4px;background:var(--fill-2);transition:width .3s var(--ease),background .3s}
.sdots i.on{width:22px;background:var(--accent)}
.pop{position:fixed;width:270px;border-radius:20px;padding:8px;animation:fadein .15s;z-index:210}
.pop-h{display:flex;gap:10px;align-items:center;padding:8px 8px 12px}
.pop-h b{display:block;font-size:14px;font-weight:600}
.pop-h small{display:block;font-size:12px;color:var(--text-3)}
.pop-i{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:11px;font-size:14px;color:var(--text);text-align:left}

  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--fill-2)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C*Math.min(1,p)} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
function rings(){
  const W=S.week, G=[5,45,3], V=[W.lessons,W.minutes,W.quizzes], R=[46,35,24], col=['var(--r1)','var(--r2)','var(--r3)'];
  return `<svg class="rings" viewBox="0 0 110 110" aria-hidden="true">${R.map((r,i)=>{const C=2*Math.PI*r;return `<circle cx="55" cy="55" r="${r}" fill="none" stroke="${col[i]}" stroke-opacity=".16" stroke-width="9"/><circle class="rg" cx="55" cy="55" r="${r}" fill="none" stroke="${col[i]}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*Math.min(1,V[i]/G[i])} ${C}" transform="rotate(-90 55 55)"/>`}).join('')}</svg>`;
}

function pageSheet(f,big){
  const d=DETAILS.find(x=>x.file===f.id);
  if(f.kind==='drawing' && d) return `<div class="pg land">${draw(d.id,'ok')}</div>`;
  const w=[92,78,86,64,90,72,84,58,88,70];
  const seed=[...f.id].reduce((a,ch)=>a+ch.charCodeAt(0),0);
  const lines=n=>Array.from({length:n},(_,i)=>`<u style="width:${w[(i+seed)%w.length]}%"></u>`).join('');

function suggest(q){
  const box=$('#sugg'); if(!box) return;
  const words=norm(q).split(/[^a-z0-9]+/).filter(w=>w.length>3);
  if(!words.length){ box.innerHTML=''; return; }
  const items=[];
  DETAILS.forEach(d=>{ const h=norm(d.t+' '+d.short+' '+d.why); const sc=words.filter(w=>h.includes(w.slice(0,5))).length; if(sc) items.push({sc:sc+.5,h:`#/atlas/${d.id}`,ic:'atlas',t:d.t}); });
  Object.keys(LESSON).forEach(id=>{ LESSON[id].m.forEach(([s,l])=>{ const h=norm(l+' '+vid(id).t); const sc=words.filter(w=>h.includes(w.slice(0,5))).length; if(sc) items.push({sc,act:`data-act="openat" data-v="${id}" data-t="${s}"`,ic:'play',t:`${l} · ${fmtT(s)}`}); }); });
  items.sort((a,b)=>b.sc-a.sc);
  const top=items.slice(0,3);
  box.innerHTML=top.length?`<p class="sgh">Možná vám pomůže hned teď</p><div class="sgl">${top.map(i=>i.h?`<a href="${i.h}">${ic(i.ic)} ${i.t}</a>`:`<a href="#" ${i.act}>${ic(i.ic)} ${i.t}</a>`).join('')}</div>`:'';
}

  const box=btn.closest('[data-quiz]'), id=box.dataset.quiz, mode=box.dataset.mode, i=+btn.dataset.i, q=LESSON[id].q;
  S.quiz[id]=i;
  if(i===q.a){ S.week.quizzes++; if(mode==='lesson' && !done(id)){ S.progress[id]=1; S.week.lessons++; } }
  save();
  box.outerHTML=quizHTML(id,{mode});
  const nb=$(`[data-quiz="${id}"]`); czech(nb);
  if(i===q.a){ celebrate(nb); if(mode==='lesson'){ refreshLessonBits(id); const db=$('[data-act="done"]'); if(db){ db.classList.add('on'); db.querySelector('span').textContent='Dokončeno'; } } }
}
let toastT;
function toast(msg,action){
  if(EMBED) return; const t=$('#toast'); t.innerHTML=`<span>${msg}</span>${action?`<button>${action[0]}</button>`:''}`;
  if(action) t.querySelector('button').onclick=()=>{ action[1](); t.classList.remove('on'); };
  t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),action?4200:2400);
}
function toggleSave(k){
  const i=S.saved.indexOf(k);
  if(i>-1){ S.saved.splice(i,1); toast('Odebráno z uložených',['Vrátit',()=>{ S.saved.splice(i,0,k); save(); route(); }]); }
  else { S.saved.unshift(k); toast('Uloženo',['Zobrazit',()=>location.hash='#/ulozene']); }
  save();
  $$(`[data-act="save"][data-k="${k}"]`).forEach(b=>{ const on=isSaved(k); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); b.querySelector('svg').outerHTML=ic(on?'savedF':'saved'); const sp=b.querySelector('span'); if(sp) sp.textContent=on?'Uloženo':'Uložit'; });
  sideNav(document.documentElement.dataset.route==='kurz'?'kurz:'+location.hash.split('/')[2]:document.documentElement.dataset.route);
}
function toggleTask(tk){
  const before=curPhase();
  S.tasks[tk]=S.tasks[tk]?0:1; save();
  $$(`[data-act="task"][data-t="${tk}"]`).forEach(b=>b.closest('li').classList.toggle('on',!!S.tasks[tk]));
  const after=curPhase();
  if(after>before){ toast(`Fáze ${PROJECT.phases[before].t} je hotová. Další: ${PROJECT.phases[after].t}.`); viewPhase=null; setTimeout(route,700); }
  else if(document.documentElement.dataset.route==='projekt') setTimeout(route,260);
}
document.addEventListener('click',e=>{
  const ovl=e.target.closest('[data-close]'); if(ovl && e.target===ovl){ closeOv(); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  switch(a){
    case 'palette': openPalette(); break;
    case 'menu': openMenu(el); break;
    case 'close': closeOv(); break;
    case 'save': toggleSave(d.k); break;
    case 'task': toggleTask(d.t); break;
    case 'qo': answerQuiz(el); break;
    case 'qretry': { const box=el.closest('[data-quiz]'); delete S.quiz[box.dataset.quiz]; save(); box.outerHTML=quizHTML(box.dataset.quiz,{mode:box.dataset.mode}); czech($(`[data-quiz="${box.dataset.quiz}"]`)); break; }
    case 'qnext': { const all=Object.keys(LESSON).filter(id=>LESSON[id].q); dqId=all.find(id=>S.quiz[id]==null)||all[(all.indexOf(dqId)+1)%all.length]; $('#dq').innerHTML=quizHTML(dqId,{mode:'daily'}); czech($('#dq')); break; }
    case 'play': startLessonPlayer(); break;
    case 'autoplay': pendingPlay=true; break;
    case 'seek': e.preventDefault(); seekTo(+d.t); break;
    case 'notefocus': { const n=$('#noteIn'); if(n){ n.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'}); setTimeout(()=>n.focus(),300); } break; }
    case 'done': { const id=$('#player').dataset.v; if(done(id)){ S.progress[id]=.5; } else { S.progress[id]=1; S.week.lessons++; toast('Lekce označena jako hotová'); } save(); el.classList.toggle('on',done(id)); el.querySelector('span').textContent=done(id)?'Dokončeno':'Hotovo'; refreshLessonBits(id); break; }
    case 'cancelnext': { const ov=el.closest('.nextov'); clearTimeout(+ov.dataset.t); ov.remove(); break; }
    case 'dl': toast('V prototypu se soubory nestahují.'); break;
    case 'ql': openQuickLook(d.f); break;
    case 'openat': e.preventDefault(); S.pos[d.v]=+d.t; pendingPlay=true; save(); closeOv(); location.hash=lessonHref(d.v); break;
    case 'tipplay': playTip(d.tip); break;
    case 'tipnav': nextTip(+d.d); break;
    case 'dmode': { dMode=d.m; const id=location.hash.split('/')[2]; const dd=detail(id); $('#draw').innerHTML=draw(id,dd.bad?dMode:'ok',true); $$('.sheetc .sg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===dMode))); $('.dleg span').textContent=dMode==='bad'?'Červeně: místo, kde vzniká problém':'Najeďte na krok postupu, ukážeme ho na výkresu'; if(innerWidth<1080) $('#draw').scrollIntoView({block:'center',behavior:'smooth'}); break; }
    case 'acat': aCat=d.c; route(); break;
    case 'fkind': fKind=d.k; route(); break;
    case 'feat': featI=+d.i; setFeat(); timers.forEach(clearInterval); timers=[]; break;
    case 'phase': viewPhase=+d.p; route(); break;
    case 'wday': wDay=+d.i; route(); break;
    case 'cstep': { S.calc[d.k]=Math.max(0,S.calc[d.k]+(+d.d)); $(d.k==='area'?'#cArea':'#cOpen').value=S.calc[d.k]; window._calcUpd&&window._calcUpd(); break; }
    case 'cset': { S.calc[d.k]=d.k==='thick'?+d.v:d.v; save(); el.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===el))); window._calcUpd&&window._calcUpd(); const ch=$$('.pmeta .chip')[2]; if(ch) ch.textContent=`${S.calc.ins} ${S.calc.thick} mm`; break; }
    case 'tocart': toast('Výpis materiálu je připravený v košíku eshop.zofi.cz',['Otevřít',()=>window.open('https://eshop.zofi.cz','_blank','noopener')]); break;
    case 'offline': { const c=d.c; S.off[c]=!S.off[c]; save(); toast(S.off[c]?'Kurz je uložený pro použití na stavbě bez signálu':'Kurz už není uložený offline'); el.innerHTML=`${ic(S.off[c]?'check':'offline')} ${S.off[c]?'Uloženo pro stavbu':'Stáhnout pro stavbu'}`; break; }
    case 'offall': S.off.all=!S.off.all; save(); route(); toast(S.off.all?`${FILES.length} podkladů je dostupných offline`:'Podklady už nejsou uložené offline'); break;
    case 'setup': openSetup(); break;
    case 'theme': S.theme=d.v; save(); applyTheme(); $$('.pop .sg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.theme))); break;
    case 'attach': { const pics=['Er5tVaQ3u2U','lcx6Xk41iSg','bCudN8yMi64','gzl2szVtVQo']; pendingAtt.push(pics[pendingAtt.length%pics.length]); $('#atts').innerHTML=pendingAtt.map((p,i)=>`<span>${im(vid(p),'ld',1,true)}<button type="button" data-act="rmatt" data-i="${i}" aria-label="Odebrat">${ic('x')}</button></span>`).join(''); $('#sendBtn').disabled=false; break; }
    case 'rmatt': pendingAtt.splice(+d.i,1); $('#atts').innerHTML=pendingAtt.map((p,i)=>`<span>${im(vid(p),'ld',1,true)}<button type="button" data-act="rmatt" data-i="${i}" aria-label="Odebrat">${ic('x')}</button></span>`).join(''); $('#sendBtn').disabled=!$('#msg').value.trim()&&!pendingAtt.length; break;
    case 'anchor': { e.preventDefault(); const t=$(el.getAttribute('href')); if(t) window.scrollTo({top:t.getBoundingClientRect().top+scrollY-120,behavior:RM?'auto':'smooth'}); $$('.anch a').forEach(x=>x.classList.toggle('glass',x===el)); $$('.anch a').forEach(x=>x.classList.toggle('cap',x===el)); break; }
  }
});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); $('#ov').innerHTML?closeOv():openPalette(); return; }
  if(e.key==='Escape'){ closeOv(); return; }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); openPalette(); return; }
  const r=document.documentElement.dataset.route;
  if(r==='kurz'||r==='video'){ if(e.key===' '&&YTP.player){ e.preventDefault(); togglePlay(); } if(e.key.toLowerCase()==='n'&&$('#noteIn')){ e.preventDefault(); $('#noteIn').focus(); } }
  if(r==='tipy'){ if(e.key==='ArrowDown'){ e.preventDefault(); nextTip(1); } if(e.key==='ArrowUp'){ e.preventDefault(); nextTip(-1); } if(e.key===' '){ e.preventDefault(); playTip(TIPS[tipActive].id); } }
});

/* ================= start ================= */
if(!location.hash || location.hash==='#/prehled') history.replaceState(null,'','#/dnes');
route();
if(new URLSearchParams(location.search).has('vitejte')) setTimeout(()=>toast('Předplatné je aktivní. Vítejte v akademii.'),500);
</script>
